# Project defaults for new chats; an existing chat can keep its selected model.
model = "gpt-6-luna"
model_reasoning_effort = "medium"

sandbox_mode = "workspace-write"
[agents]
enabled = true
# One worker/reviewer at a time, in addition to the main agent.
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"

[sandbox_workspace_write]
network_access = true
