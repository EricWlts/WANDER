<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var d = document.documentElement;
        var off = false;
        try {
          off = localStorage.getItem("wander-motion") === "off";
          d.lang = localStorage.getItem("wander-language") === "en" ? "en" : "de";
        } catch (e) {}
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) off = true;
        d.dataset.motion = off ? "off" : "on";
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161513" />
    <meta
      name="description"
      content="WANDER — eine persönliche Sammlung von Orten, Fotografien und Momenten, die es wert sind, erinnert zu werden."
    />

    <meta
      property="og:description"
      content="Eine persönliche Sammlung von Orten, Fotografien und Momenten, die es wert sind, erinnert zu werden."
    />
